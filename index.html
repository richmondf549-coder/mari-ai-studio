<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mari AI</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f14;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px;
      background: #111821;
      border-bottom: 1px solid #26313d;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    header p {
      margin: 5px 0 0;
      color: #8fa3b8;
      font-size: 13px;
    }

    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 85%;
      padding: 12px 15px;
      border-radius: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .user {
      align-self: flex-end;
      background: #2563eb;
    }

    .ai {
      align-self: flex-start;
      background: #18212b;
      border: 1px solid #293745;
    }

    #composer {
      display: flex;
      gap: 10px;
      padding: 15px;
      background: #111821;
      border-top: 1px solid #26313d;
    }

    #user-input {
      flex: 1;
      padding: 13px;
      border-radius: 12px;
      border: 1px solid #344352;
      background: #0b0f14;
      color: white;
      outline: none;
      font-size: 15px;
    }

    #send-btn {
      border: none;
      border-radius: 12px;
      padding: 0 20px;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #send-btn:disabled {
      opacity: 0.5;
    }

    .status {
      text-align: center;
      color: #718096;
      font-size: 12px;
      padding: 5px;
    }
  </style>
</head>

<body>

  <header>
    <h1>◇ Mari AI</h1>
    <p>Your AI companion</p>
  </header>

  <div id="chat-container">
    <div class="message ai">Hello. I'm Mari. How can I help you?</div>
  </div>

  <div class="status" id="status">Online</div>

  <div id="composer">
    <input
      id="user-input"
      type="text"
      placeholder="Message Mari..."
      autocomplete="off"
    >
    <button id="send-btn">Send</button>
  </div>

  <script>
    const API_BASE = "https://mari-ai-studio-1.onrender.com";

    const chatContainer = document.getElementById("chat-container");
    const userInput = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");
    const status = document.getElementById("status");

    let chatId = null;

    function addMessage(text, sender) {
      const msgDiv = document.createElement("div");
      msgDiv.classList.add("message", sender);
      msgDiv.textContent = text;

      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;

      return msgDiv;
    }

    async function createChat() {
      const response = await fetch(`${API_BASE}/api/chats`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        }
      });

      if (!response.ok) {
        throw new Error(`Could not create chat: ${response.status}`);
      }

      const chat = await response.json();
      chatId = chat.id;

      return chatId;
    }

    async function handleSend() {
      const text = userInput.value.trim();

      if (!text || sendBtn.disabled) return;

      addMessage(text, "user");

      userInput.value = "";
      sendBtn.disabled = true;
      status.textContent = "Mari is thinking...";

      const aiMessage = addMessage("", "ai");

      try {
        if (!chatId) {
          await createChat();
        }

        const response = await fetch(
          `${API_BASE}/api/chat/stream`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              prompt: text,
              chatId: chatId
            })
          }
        );

        if (!response.ok) {
          throw new Error(`Server error: ${response.status}`);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();

        let buffer = "";

        while (true) {
          const { value, done } = await reader.read();

          if (done) break;

          buffer += decoder.decode(value, { stream: true });

          const events = buffer.split("\n\n");
          buffer = events.pop();

          for (const event of events) {
            const line = event
              .split("\n")
              .find(line => line.startsWith("data: "));

            if (!line) continue;

            const data = JSON.parse(line.slice(6));

            if (data.type === "chunk") {
              aiMessage.textContent += data.text;
              chatContainer.scrollTop =
                chatContainer.scrollHeight;
            }

            if (data.type === "done" && data.chatId) {
              chatId = data.chatId;
            }

            if (data.type === "error") {
              throw new Error(data.error || "Mari encountered an error.");
            }
          }
        }

        status.textContent = "Online";

      } catch (error) {
        console.error(error);

        aiMessage.textContent =
          "Sorry, I couldn't connect to Mari's AI server.";

        status.textContent = "Connection error";
      }

      sendBtn.disabled = false;
      userInput.focus();
    }

    sendBtn.addEventListener("click", handleSend);

    userInput.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        handleSend();
      }
    });
  </script>

</body>
</html>
