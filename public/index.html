<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mari AI Studio</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b0d12;
  color:#f1f3f6;
  height:100vh;
  overflow:hidden
}
.app{display:flex;height:100vh}
.sidebar{
  width:280px;
  background:#11141a;
  border-right:1px solid #242832;
  padding:18px;
  display:flex;
  flex-direction:column;
  flex-shrink:0
}
.logo{font-size:22px;font-weight:700;margin-bottom:20px}
.new-chat{
  border:0;
  border-radius:24px;
  padding:13px 18px;
  background:#242936;
  color:white;
  cursor:pointer;
  font-size:15px;
  margin-bottom:25px
}
.new-chat:hover{background:#303644}
.recent-title{
  color:#9ba1ad;
  font-size:13px;
  margin-bottom:10px
}
.recent-chats{
  overflow-y:auto;
  flex:1
}
.chat-row{
  display:flex;
  align-items:center;
  gap:4px;
  margin-bottom:4px
}
.chat-item{
  flex:1;
  min-width:0;
  border:0;
  background:transparent;
  color:#d9dce2;
  text-align:left;
  padding:11px;
  border-radius:10px;
  cursor:pointer;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis
}
.chat-item:hover,.chat-item.active{background:#20242d}
.delete-chat{
  border:0;
  background:transparent;
  color:#888e9a;
  width:34px;
  height:34px;
  border-radius:8px;
  cursor:pointer;
  font-size:16px
}
.delete-chat:hover{
  background:#392027;
  color:#ff6b6b
}
.empty-chats{
  color:#777d88;
  font-size:13px;
  padding:10px
}
.main{
  flex:1;
  display:flex;
  flex-direction:column;
  min-width:0
}
.topbar{
  height:64px;
  border-bottom:1px solid #242832;
  display:flex;
  align-items:center;
  padding:0 22px;
  font-size:18px;
  font-weight:600
}
.chat{
  flex:1;
  overflow-y:auto;
  padding:35px 20px 150px
}
.chat-inner{
  max-width:850px;
  margin:auto
}
.welcome{
  min-height:55vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center
}
.welcome h1{
  font-size:42px;
  margin:0 0 12px
}
.welcome p{color:#9299a6}
.message{
  display:flex;
  margin:18px 0;
  line-height:1.65
}
.user-message{justify-content:flex-end}
.user-bubble{
  background:#252a34;
  padding:11px 16px;
  border-radius:20px;
  max-width:75%;
  white-space:pre-wrap
}
.mari-message{
  max-width:85%;
  padding:5px 0
}
.mari-label{
  font-weight:700;
  margin-bottom:5px
}
.mari-text p{margin:7px 0}
.mari-text h1,.mari-text h2,.mari-text h3{margin-top:18px}
.mari-text ul,.mari-text ol{padding-left:25px}
.mari-text pre{
  background:#151820;
  padding:14px;
  border-radius:10px;
  overflow-x:auto
}
.mari-text code{
  background:#191d25;
  padding:2px 5px;
  border-radius:5px
}
.mari-text pre code{
  background:transparent;
  padding:0
}
.composer-wrap{
  position:fixed;
  bottom:0;
  left:280px;
  right:0;
  padding:18px 20px 22px;
  background:linear-gradient(transparent,#0b0d12 25%)
}
.composer{
  max-width:850px;
  margin:auto;
  display:flex;
  align-items:flex-end;
  gap:10px;
  background:#191d25;
  border:1px solid #303641;
  border-radius:25px;
  padding:8px 10px 8px 17px
}
textarea{
  flex:1;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:white;
  font-size:15px;
  min-height:38px;
  max-height:140px;
  padding:9px 0
}
.send{
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:#e8ebf0;
  color:#101218;
  cursor:pointer;
  font-size:18px
}
.send:disabled{opacity:.4}
.mobile-menu{display:none}

@media(max-width:700px){
  .sidebar{
    position:fixed;
    z-index:20;
    left:-290px;
    top:0;
    bottom:0;
    transition:.2s
  }
  .sidebar.open{left:0}
  .mobile-menu{
    display:block;
    border:0;
    background:transparent;
    color:white;
    font-size:22px;
    margin-right:15px
  }
  .composer-wrap{left:0}
  .welcome h1{font-size:32px}
  .user-bubble,.mari-message{max-width:92%}
}
</style>
</head>

<body>
<div class="app">

<aside class="sidebar" id="sidebar">
  <div class="logo">✦ Mari AI</div>

  <button class="new-chat" id="newChat">
    ＋ New chat
  </button>

  <div class="recent-title">Recent chats</div>
  <div class="recent-chats" id="recentChats"></div>
</aside>

<main class="main">

  <div class="topbar">
    <button class="mobile-menu" id="mobileMenu">☰</button>
    Mari AI
  </div>

  <section class="chat" id="chat">
    <div class="chat-inner" id="chatInner"></div>
  </section>

  <div class="composer-wrap">
    <form class="composer" id="composer">
      <textarea
        id="prompt"
        placeholder="Ask Mari anything..."
        rows="1"
      ></textarea>

      <button class="send" id="send" type="submit">
        ↑
      </button>
    </form>
  </div>

</main>
</div>

<script>
const recentChats =
  document.getElementById('recentChats');

const newChatButton =
  document.getElementById('newChat');

const chatInner =
  document.getElementById('chatInner');

const promptInput =
  document.getElementById('prompt');

const composer =
  document.getElementById('composer');

const sendButton =
  document.getElementById('send');

const sidebar =
  document.getElementById('sidebar');

const mobileMenu =
  document.getElementById('mobileMenu');

let currentChatId = null;
let busy = false;

function scrollToBottom(){
  const chat =
    document.getElementById('chat');

  chat.scrollTop = chat.scrollHeight;
}

function showWelcome(){
  chatInner.innerHTML = `
    <div class="welcome">
      <h1>Hello, I'm Mari.</h1>
      <p>Your personal AI assistant.</p>
    </div>
  `;
}

function addUserMessage(text){
  const message =
    document.createElement('div');

  message.className =
    'message user-message';

  const bubble =
    document.createElement('div');

  bubble.className =
    'user-bubble';

  bubble.textContent = text;

  message.appendChild(bubble);
  chatInner.appendChild(message);

  scrollToBottom();
}

function createMariMessage(){
  const message =
    document.createElement('div');

  message.className =
    'message';

  const wrapper =
    document.createElement('div');

  wrapper.className =
    'mari-message';

  const label =
    document.createElement('div');

  label.className =
    'mari-label';

  label.textContent = 'Mari';

  const text =
    document.createElement('div');

  text.className =
    'mari-text';

  wrapper.appendChild(label);
  wrapper.appendChild(text);
  message.appendChild(wrapper);
  chatInner.appendChild(message);

  scrollToBottom();

  return text;
}

function renderChat(messages){
  chatInner.innerHTML = '';

  if(!messages.length){
    showWelcome();
    return;
  }

  for(const message of messages){

    const text =
      message?.parts?.[0]?.text || '';

    if(!text) continue;

    if(message.role === 'user'){
      addUserMessage(text);
    }

    if(message.role === 'model'){
      const mariText =
        createMariMessage();

      mariText.innerHTML =
        marked.parse(text);
    }
  }

  scrollToBottom();
}

async function loadChats(){

  try{

    const response =
      await fetch('/api/chats');

    if(!response.ok)
      throw new Error('Unable to load chats.');

    const chats =
      await response.json();

    recentChats.innerHTML = '';

    if(!chats.length){
      recentChats.innerHTML =
        '<div class="empty-chats">No conversations yet</div>';
      return;
    }

    for(const chat of chats){

      const row =
        document.createElement('div');

      row.className = 'chat-row';

      const button =
        document.createElement('button');

      button.type = 'button';
      button.className = 'chat-item';

      if(chat.id === currentChatId){
        button.classList.add('active');
      }

      button.textContent =
        chat.title || 'New chat';

      button.addEventListener(
        'click',
        () => openChat(chat.id)
      );

      const deleteButton =
        document.createElement('button');

      deleteButton.type = 'button';
      deleteButton.className = 'delete-chat';
      deleteButton.textContent = '🗑';

      deleteButton.title = 'Delete chat';

      deleteButton.addEventListener(
        'click',
        event => {
          event.stopPropagation();
          deleteChat(chat.id);
        }
      );

      row.appendChild(button);
      row.appendChild(deleteButton);

      recentChats.appendChild(row);
    }

  }catch(error){
    console.error(error);
  }
}

async function deleteChat(chatId){

  const confirmed =
    confirm('Delete this chat?');

  if(!confirmed) return;

  try{

    const response =
      await fetch(
        `/api/chats/${encodeURIComponent(chatId)}`,
        { method:'DELETE' }
      );

    if(!response.ok)
      throw new Error('Unable to delete chat.');

    if(currentChatId === chatId){
      currentChatId = null;
      showWelcome();
    }

    await loadChats();

  }catch(error){

    console.error(error);
    alert('Could not delete the chat.');
  }
}

async function createNewChat(){

  try{

    const response =
      await fetch('/api/chats',{
        method:'POST',
        headers:{
          'Content-Type':
            'application/json'
        }
      });

    if(!response.ok)
      throw new Error('Unable to create chat.');

    const chat =
      await response.json();

    currentChatId =
      chat.id;

    renderChat([]);

    await loadChats();

    promptInput.focus();

  }catch(error){
    console.error(error);
  }
}

async function openChat(chatId){

  try{

    const response =
      await fetch(
        `/api/chats/${encodeURIComponent(chatId)}`
      );

    if(!response.ok)
      throw new Error('Unable to open chat.');

    const chat =
      await response.json();

    currentChatId =
      chat.id;

    renderChat(
      chat.messages || []
    );

    await loadChats();

    sidebar.classList.remove('open');

  }catch(error){
    console.error(error);
  }
}

async function ensureChat(){

  if(currentChatId)
    return;

  await createNewChat();
}

async function streamResponse(prompt){

  await ensureChat();

  const mariText =
    createMariMessage();

  let streamedText = '';

  const response =
    await fetch('/api/chat/stream',{
      method:'POST',
      headers:{
        'Content-Type':
          'application/json'
      },
      body:JSON.stringify({
        prompt,
        chatId:currentChatId
      })
    });

  if(!response.ok)
    throw new Error('Mari could not respond.');

  const reader =
    response.body.getReader();

  const decoder =
    new TextDecoder();

  let buffer = '';

  while(true){

    const {value,done} =
      await reader.read();

    if(done) break;

    buffer +=
      decoder.decode(
        value,
        {stream:true}
      );

    const events =
      buffer.split('\n\n');

    buffer =
      events.pop();

    for(const event of events){

      if(!event.startsWith('data:'))
        continue;

      const json =
        event.slice(5).trim();

      if(!json) continue;

      const data =
        JSON.parse(json);

      if(data.type === 'chunk'){

        streamedText += data.text;

        mariText.innerHTML =
          marked.parse(streamedText);

        scrollToBottom();
      }

      if(data.type === 'done'){

        if(data.title)
          await loadChats();
      }

      if(data.type === 'error'){
        throw new Error(data.error);
      }
    }
  }
}

async function sendMessage(){

  if(busy) return;

  const text =
    promptInput.value.trim();

  if(!text) return;

  busy = true;
  sendButton.disabled = true;

  promptInput.value = '';
  promptInput.style.height = 'auto';

  addUserMessage(text);

  try{

    await streamResponse(text);

  }catch(error){

    console.error(error);

    const errorText =
      createMariMessage();

    errorText.textContent =
      'Sorry, I could not respond right now. Please try again.';
  }

  busy = false;
  sendButton.disabled = false;

  promptInput.focus();
  scrollToBottom();
}

composer.addEventListener(
  'submit',
  event => {
    event.preventDefault();
    sendMessage();
  }
);

promptInput.addEventListener(
  'keydown',
  event => {

    if(
      event.key === 'Enter' &&
      !event.shiftKey
    ){

      event.preventDefault();
      sendMessage();
    }
  }
);

promptInput.addEventListener(
  'input',
  () => {

    promptInput.style.height =
      'auto';

    promptInput.style.height =
      Math.min(
        promptInput.scrollHeight,
        140
      ) + 'px';
  }
);

newChatButton.addEventListener(
  'click',
  createNewChat
);

mobileMenu.addEventListener(
  'click',
  () => {
    sidebar.classList.toggle('open');
  }
);

async function init(){

  showWelcome();

  await loadChats();

  if(!currentChatId){
    await createNewChat();
  }

  promptInput.focus();
}

init();
</script>

</body>
</html>
